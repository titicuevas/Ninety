    <link rel="manifest" href="/manifest.json" />

    <meta name="description" content="Ninety — Tu diario futbolero. Guarda y revive todos los partidos que has visto." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Ninety" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta property="og:site_name" content="Ninety" />
    <meta property="og:title" content="Ninety — Tu diario futbolero" />
    <meta property="og:description" content="Registra los partidos que has visto. Tu diario futbolero." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ninety.up.railway.app/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ninety — Tu diario futbolero" />
    <meta name="twitter:description" content="Registra los partidos que has visto. Tu diario futbolero." />

    <title>Ninety — Tu diario futbolero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #0a0a0b; color: #fafafa; font-family: Inter, system-ui, sans-serif; }
      .ninety-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        text-align: center;
        padding: 1.5rem;
      }
      .ninety-splash__logo {
        width: 3.5rem; height: 3.5rem; border-radius: 0.875rem;
        overflow: hidden;
        animation: splash-pulse 2.2s ease-in-out infinite;
      }
      .ninety-splash__logo svg { width: 100%; height: 100%; display: block; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .ninety-splash__title { font-size: 1.75rem; font-weight: 700; margin: 0; }
      .ninety-splash__tagline { color: #a1a1aa; max-width: 20rem; line-height: 1.5; font-size: 0.9375rem; margin: 0; }
      #root > .ninety-splash { transition: opacity 0.25s ease, visibility 0.25s ease; }
      #root > .ninety-splash.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <noscript>
      <div class="ninety-splash">
        <div class="ninety-splash__logo"><svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#0a0a0b"/></linearGradient></defs><rect width="512" height="512" rx="108" fill="url(#sp)"/><rect x="32" y="32" width="448" height="448" rx="76" fill="none" stroke="#10b981" stroke-width="5" opacity="0.3"/><line x1="256" y1="72" x2="256" y2="440" stroke="#10b981" stroke-width="4" opacity="0.22"/><circle cx="256" cy="256" r="72" fill="none" stroke="#10b981" stroke-width="4" opacity="0.22"/><text x="256" y="290" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="200" font-weight="800" letter-spacing="-12">90</text><text x="256" y="348" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="28" font-weight="600" letter-spacing="6" opacity="0.55">MIN</text></svg></div>
        <p class="ninety-splash__title">Ninety</p>
        <p class="ninety-splash__tagline">Tu diario futbolero. Activa JavaScript para continuar.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Splash de marca (sin rueda): la landing `/` pinta al montar React sin auth gate. -->
      <div class="ninety-splash" aria-live="polite">
        <div class="ninety-splash__logo"><svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sp2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#0a0a0b"/></linearGradient></defs><rect width="512" height="512" rx="108" fill="url(#sp2)"/><rect x="32" y="32" width="448" height="448" rx="76" fill="none" stroke="#10b981" stroke-width="5" opacity="0.3"/><line x1="256" y1="72" x2="256" y2="440" stroke="#10b981" stroke-width="4" opacity="0.22"/><circle cx="256" cy="256" r="72" fill="none" stroke="#10b981" stroke-width="4" opacity="0.22"/><text x="256" y="290" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="200" font-weight="800" letter-spacing="-12">90</text><text x="256" y="348" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="28" font-weight="600" letter-spacing="6" opacity="0.55">MIN</text></svg></div>
        <p class="ninety-splash__title">Ninety</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fade-out del splash en cuanto React monta el primer frame real
      (function () {
        var observer = new MutationObserver(function () {
          var splash = document.querySelector('#root > .ninety-splash');
          var root = document.getElementById('root');
          if (splash && root && root.children.length > 1) {
            splash.classList.add('splash-hidden');
            setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 300);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
