# QA E2E — smoke público + a11y (sin secretos de usuario)
name: QA E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install root + workspaces
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke público + a11y contra prod
        env:
          CI: true
          E2E_API_URL: https://ninety-api.up.railway.app
          E2E_BASE_URL: https://ninety.up.railway.app
          # Misma cuenta que seed:demo / README. Si no existe, los tests de perfil se saltan.
          TEST_USER_USERNAME: aficionado_demo
        run: npm run test:e2e:public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
