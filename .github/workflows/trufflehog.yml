# Escaneo de secretos con TruffleHog OSS
# https://github.com/marketplace/actions/trufflehog-oss
name: TruffleHog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Sin base/head: la action calcula el rango según el evento
      # (push → before/after; PR → base/head SHA). Evita el fallo
      # "BASE and HEAD commits are the same" en pushes a main.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          # Solo secretos verificados → menos falsos positivos
          extra_args: --only-verified --no-update
