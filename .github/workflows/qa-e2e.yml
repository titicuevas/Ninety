# QA E2E contra staging cuando QA_* está configurado; fallback temporal a producción.
name: QA E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  E2E_API_URL: ${{ vars.QA_API_URL || 'https://ninety-api.up.railway.app' }}
  E2E_BASE_URL: ${{ vars.QA_BASE_URL || 'https://www.getninety.app' }}
  E2E_SITE_URL: ${{ vars.QA_BASE_URL || 'https://www.getninety.app' }}
  DEMO_USERNAME: beta_ninety
  TEST_USER_USERNAME: beta_ninety
  TEST_USER_EMAIL: beta@ninety.app

jobs:
  e2e-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root + workspaces
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Smoke público Chromium/Firefox/WebKit + a11y
        run: npm run test:e2e:public

      - name: Open Graph contra servidor de producción local
        run: >-
          env -u E2E_BASE_URL -u E2E_API_URL -u E2E_SITE_URL
          npm run test:e2e:og -- --retries=3

      - name: Boundary de rutas contra app local
        if: always()
        run: env -u E2E_BASE_URL -u E2E_API_URL npm run test:e2e:boundary

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-public
          path: playwright-report/
          retention-days: 7

  e2e-auth:
    if: ${{ vars.QA_BASE_URL != '' && vars.QA_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      E2E_FORBID_SKIPS: true
    steps:
      - name: Exigir credenciales QA
        run: |
          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "::error::Falta el secret TEST_USER_PASSWORD para beta@ninety.app."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root + workspaces
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: QA autenticado completo (sin skips)
        run: >-
          npx playwright test
          --project=chromium
          --project=a11y-auth
          --project=mobile
          --project=tablet
          --project=desktop-shell
          --project=firefox-auth
          --project=webkit-auth

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 7
