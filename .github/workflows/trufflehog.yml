# Escaneo de secretos con TruffleHog OSS
# https://github.com/marketplace/actions/trufflehog-oss
name: TruffleHog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # La action oficial falla en push a main con base/head=default
      # ("BASE and HEAD are the same") y, sin ellos, a veces pasa
      # --since-commit/--branch mal entrecomillados (exit 1 = error de
      # escaneo, no hallazgo; los secretos verificados salen con 183).
      - name: Resolve scan range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD_REF="${{ github.event.after }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse "${HEAD_REF}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            fi
          else
            HEAD_REF="$(git rev-parse HEAD)"
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          if [ "$BASE" = "$HEAD_REF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "BASE y HEAD iguales ($HEAD_REF); nada que escanear."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "Escaneando $BASE..$HEAD_REF"
          fi

      - name: TruffleHog OSS
        if: steps.range.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.96.0 \
            git file:///repo \
            --since-commit "${{ steps.range.outputs.base }}" \
            --branch "${{ steps.range.outputs.head }}" \
            --results=verified \
            --fail \
            --no-update \
            --github-actions
