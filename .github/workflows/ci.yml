# Typecheck + unitarios (sin Playwright ni secretos de usuario)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root + workspaces
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Secrets en el árbol
        run: npm run check:secrets

      - name: Seguridad de migraciones Supabase
        run: npm run check:supabase

      - name: Vulnerabilidades de producción
        run: npm run check:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Código y dependencias sin uso
        run: npm run check:dead-code

      - name: Build + presupuesto de bundle
        run: npm run build:budget

      - name: Unit backend
        run: npm test && npm run test:security --prefix backend

      - name: Unit frontend
        run: npm run test --prefix frontend

      - name: Umbrales de cobertura
        run: npm run test:coverage
