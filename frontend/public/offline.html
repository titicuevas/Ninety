<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Sin conexión · Ninety</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, sans-serif;
      background: #0a0a0b;
      color: #fafafa;
      padding: 1.5rem;
      text-align: center;
    }
    .logo {
      width: 3rem; height: 3rem; border-radius: 0.75rem;
      background: #10b981; color: #042f1e;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; margin-bottom: 1rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #a1a1aa; max-width: 20rem; line-height: 1.5; font-size: 0.9375rem; }
    a {
      display: inline-block; margin-top: 1.25rem;
      padding: 0.625rem 1.25rem; border-radius: 0.5rem;
      background: #10b981; color: #042f1e; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">90</div>
    <h1>Sin conexión</h1>
    <p>Ninety necesita red para cargar tu diario. Revisa la conexión e inténtalo de nuevo.</p>
    <a href="/">Reintentar</a>
  </main>
</body>
</html>
